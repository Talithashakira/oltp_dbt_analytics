version: 2

models:
  - name: int_order_payments_summary
    description: >
      One row per order, aggregating every payment transaction on that order.
      Grain: one row per order_id.
    columns:
      - name: order_id
        description: Foreign key to stg_orders.order_id.
        tests:
          - unique
          - not_null
      - name: total_payment_value
        description: Sum of payment_value across every payment method used on the order.
        tests:
          - not_null
      - name: payment_count
        description: >
          Number of payment transaction rows for the order. An order paid with
          multiple methods or vouchers has more than one row.
        tests:
          - not_null
      - name: max_installments
        description: The largest installment count used by any payment method on the order.
      - name: primary_payment_type
        description: The payment_type with the single largest payment_value on the order.

  - name: int_order_reviews_summary
    description: >
      One row per order, keeping only its most recent review in case an order
      received more than one. Grain: one row per order_id.
    columns:
      - name: order_id
        description: Foreign key to stg_orders.order_id.
        tests:
          - unique
          - not_null
      - name: review_id
        description: The review_id of the most recent review left for this order.
        tests:
          - not_null
      - name: review_score
        description: 1-5 star rating from the most recent review.
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]